name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/oscilla-release.keystore"
          if [ ! -s "$RUNNER_TEMP/oscilla-release.keystore" ]; then
            echo "Decoded keystore is empty. Check SIGNING_KEYSTORE_BASE64." >&2
            exit 1
          fi

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          ./gradlew :app:printReleaseVersion -PgitTag="${GITHUB_REF_NAME}" -q | tee "$RUNNER_TEMP/version.env"
          grep -E '^version_(name|code)=' "$RUNNER_TEMP/version.env" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/oscilla-release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PgitTag="${GITHUB_REF_NAME}" --stacktrace

      - name: Collect and verify APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          src=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [ -z "$src" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          apk="oscilla-${VERSION_NAME}.apk"
          cp "$src" "$apk"
          roots=()
          if [ -n "${ANDROID_HOME:-}" ]; then roots+=("$ANDROID_HOME"); fi
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ "${ANDROID_SDK_ROOT:-}" != "${ANDROID_HOME:-}" ]; then
            roots+=("$ANDROID_SDK_ROOT")
          fi
          aapt=$(find "${roots[@]}" -type f -name aapt -print 2>/dev/null | sort | tail -n 1)
          badging=$("$aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -q "versionCode='${VERSION_CODE}'"
          printf '%s\n' "$badging" | grep -q "versionName='${VERSION_NAME}'"
          apksigner=$(find "${roots[@]}" -type f -name apksigner -print 2>/dev/null | sort | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          echo "asset=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ASSET: ${{ steps.apk.outputs.asset }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Signed release APK for sideload and Obtainium.

          - versionName: ${VERSION_NAME}
          - versionCode: ${VERSION_CODE} (from tag ${GITHUB_REF_NAME}: MAJOR * 1000000 + MINOR * 1000 + PATCH)

          Install on a device with USB debugging:

          ```
          adb install -r ${ASSET}
          ```
          EOF
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$ASSET" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$ASSET" \
              --title "Oscilla ${VERSION_NAME}" \
              --notes "$notes" \
              --verify-tag
          fi
